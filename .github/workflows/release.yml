name: Build & Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  build-linux:
    # 22.04 on purpose: glibc 2.35 keeps the AppImage portable to older distros
    # (ubuntu-latest = 24.04 → glibc 2.39, katalog AppImage menandai not self-contained)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev patchelf squashfs-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Tauri bundles
        run: |
          # guard: files must stay world-readable/executable inside the AppImage
          # (V1.0.0 shipped AppRun.wrapped as 770 → firejail "Permission denied")
          umask 022
          npx tauri build
      - name: Repack AppImage with safe permissions
        # NOTE: deliberately NOT appimagetool — its AppDir staging forces every
        # directory to 0700 in the squashfs. The catalog test harness runs apps
        # through firejail as a normal user (files appear root:root), so 0700
        # dirs make AppRun unrunnable: "Permission denied" despite 755 files.
        # We rebuild the squashfs directly with mksquashfs (mode-faithful) and
        # prepend the official AppImageKit runtime (xz-compatible).
        run: |
          curl -sL -o runtime-x86_64 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-x86_64
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$img" ] || { echo "ERROR: no AppImage found" >&2; exit 1; }
            echo "Repacking: $img"
            rm -rf .repack-root
            "$img" --appimage-extract > /dev/null
            mv squashfs-root .repack-root
            # dirs: world-traversable; execs: world-executable; everything: world-readable
            find .repack-root -type d -exec chmod 755 {} +
            chmod 755 .repack-root/AppRun .repack-root/AppRun.wrapped 2>/dev/null || true
            if [ -d .repack-root/usr/bin ]; then
              find .repack-root/usr/bin -maxdepth 1 -type f -exec chmod 755 {} +
            fi
            chmod -R a+rX .repack-root
            SQ="$(mktemp --suffix=.img)"
            mksquashfs .repack-root "$SQ" -root-owned -noappend -comp xz -quiet -no-progress
            cat runtime-x86_64 "$SQ" > "$img"
            rm -f "$SQ"
            chmod +x "$img"
          done
      - name: Verify AppImage permissions
        # Mirrors the catalog harness: firejail exposes files as root:root and
        # runs the app as a normal user, so every dir needs o+x and AppRun needs
        # o+rx. We check bits on ALL dirs/execs AND actually traverse as nobody.
        run: |
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$img" ] || { echo "ERROR: no AppImage found" >&2; exit 1; }
            rm -rf squashfs-root
            "$img" --appimage-extract > /dev/null
            BAD_DIRS=$(find squashfs-root -type d ! -perm -005)
            BAD_EXECS=$(find squashfs-root \( -name 'AppRun*' -o -path './usr/bin/*' \) -type f ! -perm -005)
            if [ -n "$BAD_DIRS" ] || [ -n "$BAD_EXECS" ]; then
              echo "FAIL: world-inaccessible entries in $img:"
              echo "$BAD_DIRS $BAD_EXECS"
              exit 1
            fi
            for f in AppRun AppRun.wrapped; do
              sudo -u nobody test -r "squashfs-root/$f" || { echo "FAIL: nobody cannot read $f"; exit 1; }
              sudo -u nobody test -x "squashfs-root/$f" || { echo "FAIL: nobody cannot execute $f"; exit 1; }
            done
            rm -rf squashfs-root
            echo "OK: $img is world-traversable/executable (incl. nobody test)"
          done
      - name: Upload Linux bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          tag_name: ${{ github.ref_name }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - name: Upload Windows bundle
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          tag_name: ${{ github.ref_name }}
