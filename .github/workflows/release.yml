name: Build & Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  build-linux:
    # 22.04 on purpose: glibc 2.35 keeps the AppImage portable to older distros
    # (ubuntu-latest = 24.04 → glibc 2.39, katalog AppImage menandai not self-contained)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev patchelf squashfs-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Tauri bundles
        run: |
          # guard: files must stay world-readable/executable inside the AppImage
          # (V1.0.0 shipped AppRun.wrapped as 770 → firejail "Permission denied")
          umask 022
          npx tauri build
      - name: Repack AppImage with safe permissions
        # NOTE:
        # 1. Do NOT use appimagetool — its AppDir staging forces every directory to 0700.
        # 2. Do NOT use -comp xz — the appimage.github.io catalog test uses runtime-fuse2
        #    which ONLY supports zlib and zstd (fails with "Squashfs image uses xz compression").
        # 3. Do NOT replace the runtime with a generic 193KB runtime — slice the original
        #    embedded runtime using its official `--appimage-offset` flag.
        run: |
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$img" ] || { echo "ERROR: no AppImage found" >&2; exit 1; }
            echo "Repacking: $img"
            OFFSET=$("$img" --appimage-offset)
            head -c "$OFFSET" "$img" > .orig-runtime
            rm -rf .repack-root
            "$img" --appimage-extract > /dev/null
            mv squashfs-root .repack-root
            # dirs: world-traversable; execs: world-executable; everything: world-readable
            find .repack-root -type d -exec chmod 755 {} +
            chmod 755 .repack-root/AppRun .repack-root/AppRun.wrapped 2>/dev/null || true
            if [ -d .repack-root/usr/bin ]; then
              find .repack-root/usr/bin -maxdepth 1 -type f -exec chmod 755 {} +
            fi
            chmod -R a+rX .repack-root
            SQ="$(mktemp --suffix=.img)"
            mksquashfs .repack-root "$SQ" -root-owned -noappend -comp zstd -quiet -no-progress
            cat .orig-runtime "$SQ" > "$img"
            rm -f "$SQ" .orig-runtime
            chmod +x "$img"
          done
      - name: Verify AppImage permissions
        # Test against BOTH native extraction and the catalog's exact test runtime (runtime-fuse2)
        run: |
          curl -sL -o runtime-fuse2-x86_64 \
            https://github.com/AppImage/appimage.github.io/releases/download/deps/runtime-fuse2-x86_64
          chmod +x runtime-fuse2-x86_64
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$img" ] || { echo "ERROR: no AppImage found" >&2; exit 1; }
            echo "Verifying $img with catalog runtime..."
            rm -rf squashfs-root
            TARGET_APPIMAGE="$img" ./runtime-fuse2-x86_64 --appimage-extract > /dev/null
            BAD_DIRS=$(find squashfs-root -type d ! -perm -005)
            BAD_EXECS=$(find squashfs-root \( -name 'AppRun*' -o -path './usr/bin/*' \) -type f ! -perm -005)
            if [ -n "$BAD_DIRS" ] || [ -n "$BAD_EXECS" ]; then
              echo "FAIL: world-inaccessible entries in $img:"
              echo "$BAD_DIRS $BAD_EXECS"
              exit 1
            fi
            for f in AppRun AppRun.wrapped; do
              sudo -u nobody test -r "squashfs-root/$f" || { echo "FAIL: nobody cannot read $f"; exit 1; }
              sudo -u nobody test -x "squashfs-root/$f" || { echo "FAIL: nobody cannot execute $f"; exit 1; }
            done
            rm -rf squashfs-root
            echo "OK: $img mounts/extracts cleanly with catalog runtime and has world-accessible 755 perms"
          done
      - name: Upload Linux bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          tag_name: ${{ github.ref_name }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - name: Upload Windows bundle
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          tag_name: ${{ github.ref_name }}
