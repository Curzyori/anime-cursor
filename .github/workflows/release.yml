name: Build & Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: write

jobs:
  build-linux:
    # 22.04 on purpose: glibc 2.35 keeps the AppImage portable to older distros
    # (ubuntu-latest = 24.04 → glibc 2.39, katalog AppImage menandai not self-contained)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Tauri bundles
        run: |
          # guard: files must stay world-readable/executable inside the AppImage
          # (V1.0.0 shipped AppRun.wrapped as 770 → firejail "Permission denied")
          umask 022
          npx tauri build
      - name: Repack AppImage with safe permissions
        run: |
          curl -sL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract > /dev/null
          mv squashfs-root appimagetool-dir
          TOOL="appimagetool-dir/AppRun"
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$img" ] || { echo "ERROR: no AppImage found" >&2; exit 1; }
            echo "Repacking: $img"
            rm -rf .repack-root
            "$img" --appimage-extract > /dev/null
            mv squashfs-root .repack-root
            if [ -f .repack-root/AppRun ]; then chmod 755 .repack-root/AppRun; fi
            if [ -f .repack-root/AppRun.wrapped ]; then chmod 755 .repack-root/AppRun.wrapped; fi
            if [ -d .repack-root/usr/bin ]; then
              find .repack-root/usr/bin -maxdepth 1 -type f -exec chmod 755 {} +
            fi
            ARCH=x86_64 "$TOOL" .repack-root "$(basename "$img")"
            mv "$(basename "$img")" "$img"
          done
      - name: Verify AppImage permissions
        run: |
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -e "$img" ] || { echo "ERROR: no AppImage found" >&2; exit 1; }
            rm -rf squashfs-root
            "$img" --appimage-extract > /dev/null
            BAD=$(find squashfs-root \( -name 'AppRun*' -o -path './usr/bin/*' \) -type f ! -perm -005)
            if [ -n "$BAD" ]; then
              echo "FAIL: files missing world-executable bit in $img:"
              echo "$BAD"
              exit 1
            fi
            rm -rf squashfs-root
            echo "OK: $img executables are world-executable"
          done
      - name: Upload Linux bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          tag_name: ${{ github.ref_name }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - name: Upload Windows bundle
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          tag_name: ${{ github.ref_name }}
